name: E2E

on:
  push:
    branches: [ 'main' ]
  pull_request:
    paths:
      - '.github/workflows/e2e.yml'
      - 'frontend/**'
      - 'e2e/**'
      # The e2e suite exercises the whole stack, so anything that changes what
      # comes up has to trigger it.
      - 'backend/**'
      - 'ota-agent/**'
      - 'csv-provider/**'
      - 'seed/vehicles.json'
      - 'docker-compose.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Start Docker stack
        run: docker compose up -d --build

      # The backend waits for HawkBit to report healthy, which takes ~2 minutes
      # from cold on a CI runner, so this budget is deliberately generous.
      - name: Wait for backend
        run: |
          for i in $(seq 1 150); do
            if curl -fsS http://localhost:3000/health > /dev/null; then
              echo "backend ready"; exit 0
            fi
            sleep 2
          done
          echo "backend did not become ready"; exit 1

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8090/ > /dev/null; then
              echo "frontend ready"; exit 0
            fi
            sleep 2
          done
          echo "frontend did not become ready"; exit 1

      # Positions travel CSV Provider -> Databroker -> FMS Forwarder -> Zenoh ->
      # FMS Consumer -> InfluxDB -> backend, so wait for a vehicle to actually
      # move off its seeded coordinates rather than guessing at a fixed delay.
      - name: Wait for telemetry to reach the backend
        run: |
          previous=$(curl -fsS http://localhost:3000/fleet)
          for i in $(seq 1 60); do
            sleep 2
            current=$(curl -fsS http://localhost:3000/fleet)
            # The store only touches a record when a position actually changes,
            # so any difference means the pipeline is delivering.
            if [ "$current" != "$previous" ]; then
              echo "telemetry flowing"; exit 0
            fi
          done
          echo "no telemetry reached the backend"; exit 1

      - name: Run Playwright tests
        working-directory: e2e
        run: npm test

      - name: Dump Docker logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v
