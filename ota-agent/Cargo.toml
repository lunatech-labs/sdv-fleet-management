[package]
name = "ota-agent"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
tokio       = { version = "1",    features = ["full"] }
clap        = { version = "4",    features = ["derive", "env"] }
rand        = "0.8"
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
log         = "0.4"
env_logger  = "0.11"

# The same Kuksa client the blueprint FMS Forwarder uses, rather than vendored
# protos and a second gRPC stack.
kuksa-rust-sdk = "0.2.1"

# uProtocol: OTA state transitions are reported to the back end as Notifications.
up-rust             = { version = "0.4.0", default-features = false, features = ["communication"] }
up-transport-zenoh  = "0.5.0"
zenoh               = { version = "1.2.1", default-features = false }
protobuf            = "3.7.2"
async-trait         = "0.1"

[build-dependencies]
protobuf-codegen = "3.7.2"
