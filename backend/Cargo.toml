[package]
name    = "backend"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
axum                = { version = "0.7", features = ["ws"] }
tokio               = { version = "1", features = ["full"] }
dashmap             = "5"
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
chrono              = { version = "0.4", features = ["serde"] }
tower-http          = { version = "0.5", features = ["cors"] }
utoipa              = { version = "4", features = ["axum_extras", "chrono", "uuid"] }
reqwest             = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid                = { version = "1", features = ["v4", "serde"] }

# uProtocol: receives OTA state transitions from the in-vehicle agents.
up-rust             = { version = "0.4.0", default-features = false, features = ["communication"] }
up-transport-zenoh  = "0.5.0"
zenoh               = { version = "1.2.1", default-features = false }
protobuf            = "3.7.2"
async-trait         = "0.1"

thiserror           = "1"
clap                = { version = "4", features = ["derive", "env"] }
log                 = "0.4"
env_logger          = "0.11"

[build-dependencies]
protobuf-codegen    = "3.7.2"

[dev-dependencies]
tower             = { version = "0.4", features = ["util"] }
http-body-util    = "0.1"
tokio-tungstenite = "0.24"
futures-util      = "=0.3.31"
