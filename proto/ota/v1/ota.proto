syntax = "proto3";

package ota.v1;

// State of an OTA update on a single vehicle.
//
// Mirrors the states the in-vehicle agent reports to HawkBit's DDI API, so the
// back end sees the same progression whether it learns about it from a
// uProtocol notification or by reconciling against the HawkBit Management API.
enum UpdateState {
  UPDATE_STATE_UNSPECIFIED = 0;
  UPDATE_STATE_PENDING = 1;
  UPDATE_STATE_DOWNLOADING = 2;
  UPDATE_STATE_INSTALLING = 3;
  UPDATE_STATE_COMPLETE = 4;
  UPDATE_STATE_FAILED = 5;
}

// Reported by the in-vehicle OTA agent on every state transition, as a
// uProtocol Notification addressed to the back end orchestrator.
message OtaStatus {
  // Vehicle the update is running on.
  string vin = 1;
  // HawkBit action this status refers to.
  uint64 action_id = 2;
  // State the vehicle has just entered.
  UpdateState state = 3;
  // Software version being installed. Set for every state, so the back end can
  // record it when the update completes.
  string version = 4;
  // Failure detail. Only set when state is UPDATE_STATE_FAILED.
  string error = 5;
  // When the transition happened, in milliseconds since the Unix epoch.
  uint64 timestamp_ms = 6;
}
