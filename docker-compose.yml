# Telemetry follows the Eclipse SDV Fleet Management blueprint: a CSV Provider
# replays a recording into a per-vehicle Kuksa Databroker, an FMS Forwarder
# publishes VehicleStatus over uProtocol (Zenoh transport), and the FMS Consumer
# writes it to InfluxDB. Our backend reads the fleet state back out of InfluxDB.
#
# The OTA flow is the part that is additive to the blueprint: HawkBit plus an
# in-vehicle OTA agent per vehicle.

networks:
  fms-backend:
  fms-vehicle:

volumes:
  influxdb-data:
  influxdb-config:
  influxdb-auth:
  influxdb-datasources:

# Shared by every vehicle's OTA agent. build + image together so BuildKit builds
# the image once and the other agents reuse it instead of pulling from a registry.
x-ota-agent-defaults: &ota-agent-defaults
  # Built from the repository root so proto/ is shared with the backend.
  build:
    context: .
    dockerfile: ota-agent/Dockerfile
  image: ota-agent:local
  networks:
    - fms-vehicle
    - fms-backend
  depends_on:
    # ota-agents self-register against HawkBit DDI on startup — wait until
    # HawkBit is healthy so the first request doesn't have to burn retries.
    hawkbit:
      condition: service_healthy
    fms-zenoh-router:
      condition: service_started
  volumes:
    - ./config/zenoh/config-client.json5:/zenoh-config.json5:ro
  environment: &ota-agent-env
    HAWKBIT_URL: http://hawkbit:8080
    HAWKBIT_GATEWAY_TOKEN: ${HAWKBIT_GATEWAY_TOKEN:-fleet-demo-gateway-token}
    KUKSA_PORT: "55556"
    FAILURE_RATE: "0.2"
    DOWNLOAD_DELAY_SECS: "5"
    INSTALL_DELAY_SECS: "3"
  restart: on-failure

x-databroker-defaults: &databroker-defaults
  image: quay.io/eclipse-kuksa/kuksa-databroker:0.6.0
  networks:
    - fms-vehicle
  volumes:
    - ./spec/overlay/vss.json:/vss_overlay.json:ro
  environment:
    KUKSA_DATABROKER_ADDR: "0.0.0.0"
    KUKSA_DATABROKER_PORT: "55556"
    KUKSA_DATABROKER_METADATA_FILE: /vss_overlay.json
    RUST_LOG: info
  # for the time being, we do not use TLS secured connections to the Databroker
  command: "--insecure"
  restart: unless-stopped

x-csv-provider-defaults: &csv-provider-defaults
  image: quay.io/eclipse-kuksa/csv-provider:0.4.6
  networks:
    - fms-vehicle
  environment: &csv-provider-env
    PROVIDER_INFINITE: 1
    PROVIDER_LOG_LEVEL: INFO
    KUKSA_DATA_BROKER_PORT: "55556"
  restart: unless-stopped

x-forwarder-defaults: &forwarder-defaults
  image: ghcr.io/eclipse-sdv-blueprints/fleet-management/fms-forwarder:main
  networks:
    - fms-vehicle
    - fms-backend
  command: "zenoh -c /zenoh-config.json5"
  volumes:
    - ./config/zenoh/config-client.json5:/zenoh-config.json5:ro
  depends_on:
    fms-zenoh-router:
      condition: service_started
  environment: &forwarder-env
    TIMER_INTERVAL: "500ms"
    RUST_LOG: "info,fms_forwarder=info"
  # The forwarder dials the Databroker and the Zenoh router at startup and does
  # not retry indefinitely, so it must be restarted if either is not up yet.
  restart: unless-stopped

services:

  # ── uProtocol transport ────────────────────────────────────────────────────
  fms-zenoh-router:
    image: eclipse/zenoh:1.9.0
    container_name: fms-zenoh-router
    command: -c /zenoh-config.json5
    environment:
      RUST_LOG: zenoh=info
    networks:
      - fms-backend
      - fms-vehicle
    ports:
      - "127.0.0.1:7447:7447/tcp"
    volumes:
      - ./config/zenoh/config-router.json5:/zenoh-config.json5:ro
    restart: unless-stopped

  # ── Telemetry store ────────────────────────────────────────────────────────
  influxdb:
    image: docker.io/library/influxdb:2.7
    container_name: influxDB
    command: influxd
    networks:
      - fms-backend
    ports:
      - "127.0.0.1:8086:8086"
    env_file: ./influxdb/fms-demo.env
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: fms-demo
      DOCKER_INFLUXDB_INIT_PASSWORD: fms-demo-secret
      DOCKER_INFLUXDB_INIT_RETENTION: 1w
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: fms-backend-admin-token
    healthcheck:
      test: ["CMD-SHELL", "influx ping"]
      interval: 5s
      timeout: 3s
      start_period: 5s
    volumes:
      - ./influxdb/init-scripts/create-fms-token.sh:/docker-entrypoint-initdb.d/influxdb_init.sh:ro
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
      - influxdb-auth:/tmp/out
      # The init script also emits a Grafana datasource definition. We do not run
      # Grafana, but the script runs under `set -e`, so the target must exist.
      - influxdb-datasources:/tmp/influxdb-datasources

  fms-consumer:
    image: ghcr.io/eclipse-sdv-blueprints/fleet-management/fms-consumer:main
    container_name: fms-consumer
    # Upstream publishes fms-consumer for linux/amd64 only (fms-forwarder is the
    # only multi-arch image), so this runs under emulation on arm64 hosts.
    platform: linux/amd64
    command: "zenoh -c /zenoh-config.json5"
    networks:
      - fms-backend
    depends_on:
      influxdb:
        condition: service_healthy
      fms-zenoh-router:
        condition: service_started
    env_file: ./influxdb/fms-demo.env
    environment:
      INFLUXDB_TOKEN_FILE: /tmp/fms-demo.token
      RUST_LOG: "info,fms_consumer=debug,influx_client=debug"
    volumes:
      - ./config/zenoh/config-client.json5:/zenoh-config.json5:ro
      - influxdb-auth:/tmp:ro
    restart: unless-stopped

  # ── Vehicles ───────────────────────────────────────────────────────────────
  databroker-01:
    <<: *databroker-defaults
    ports: ["127.0.0.1:55556:55556"]

  databroker-02:
    <<: *databroker-defaults
    ports: ["127.0.0.1:55557:55556"]

  databroker-03:
    <<: *databroker-defaults
    ports: ["127.0.0.1:55558:55556"]

  csv-provider-01:
    <<: *csv-provider-defaults
    depends_on: { databroker-01: { condition: service_started } }
    volumes: ["./csv-provider/vehicles/VIN-0001.csv:/dist/signals.csv:ro"]
    environment:
      <<: *csv-provider-env
      KUKSA_DATA_BROKER_ADDR: databroker-01

  csv-provider-02:
    <<: *csv-provider-defaults
    depends_on: { databroker-02: { condition: service_started } }
    volumes: ["./csv-provider/vehicles/VIN-0002.csv:/dist/signals.csv:ro"]
    environment:
      <<: *csv-provider-env
      KUKSA_DATA_BROKER_ADDR: databroker-02

  csv-provider-03:
    <<: *csv-provider-defaults
    depends_on: { databroker-03: { condition: service_started } }
    volumes: ["./csv-provider/vehicles/VIN-0003.csv:/dist/signals.csv:ro"]
    environment:
      <<: *csv-provider-env
      KUKSA_DATA_BROKER_ADDR: databroker-03

  # Each forwarder publishes on its own uProtocol authority so the consumer can
  # tell the vehicles apart; fms-consumer subscribes to up://*/D100/1/D100.
  fms-forwarder-01:
    <<: *forwarder-defaults
    environment:
      <<: *forwarder-env
      KUKSA_DATABROKER_URI: http://databroker-01:55556
      TOPIC: up://VIN-0001/D100/1/D100

  fms-forwarder-02:
    <<: *forwarder-defaults
    environment:
      <<: *forwarder-env
      KUKSA_DATABROKER_URI: http://databroker-02:55556
      TOPIC: up://VIN-0002/D100/1/D100

  fms-forwarder-03:
    <<: *forwarder-defaults
    environment:
      <<: *forwarder-env
      KUKSA_DATABROKER_URI: http://databroker-03:55556
      TOPIC: up://VIN-0003/D100/1/D100

  ota-agent-01:
    <<: *ota-agent-defaults
    environment:
      <<: *ota-agent-env
      VEHICLE_VIN: VIN-0001
      KUKSA_HOST: databroker-01

  ota-agent-02:
    <<: *ota-agent-defaults
    environment:
      <<: *ota-agent-env
      VEHICLE_VIN: VIN-0002
      KUKSA_HOST: databroker-02

  ota-agent-03:
    <<: *ota-agent-defaults
    environment:
      <<: *ota-agent-env
      VEHICLE_VIN: VIN-0003
      KUKSA_HOST: databroker-03

  # ── OTA campaign orchestration ─────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    networks:
      - fms-backend
    environment:
      POSTGRES_DB: hawkbit
      POSTGRES_USER: hawkbit
      POSTGRES_PASSWORD: hawkbit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hawkbit -d hawkbit"]
      interval: 5s
      timeout: 3s
      retries: 10

  hawkbit:
    image: hawkbit/hawkbit-update-server:1.1.0
    networks:
      - fms-backend
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hawkbit
      SPRING_DATASOURCE_USERNAME: hawkbit
      SPRING_DATASOURCE_PASSWORD: hawkbit
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE: POSTGRESQL
      # The DDI gateway token is tenant configuration, so it is provisioned by
      # the backend through the Management API on startup rather than set here.
      # Management API user — must match HAWKBIT_USER / HAWKBIT_PASSWORD on the
      # backend service. {noop} tells Spring Security the password is plaintext.
      HAWKBIT_SERVER_IM_USERS_0_USERNAME: ${HAWKBIT_USER:-admin}
      HAWKBIT_SERVER_IM_USERS_0_PASSWORD: "{noop}${HAWKBIT_PASSWORD:-admin}"
      HAWKBIT_SERVER_IM_USERS_0_FIRSTNAME: admin
      HAWKBIT_SERVER_IM_USERS_0_LASTNAME: admin
      HAWKBIT_SERVER_IM_USERS_0_EMAIL: admin@example.org
      HAWKBIT_SERVER_IM_USERS_0_PERMISSIONS: ALL
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # HawkBit 1.1.0 does not expose the Spring actuator, so readiness is probed
      # against the Management API instead. An unauthenticated request answers
      # 401 once the app is serving, which is all we need to know here; the image
      # only has BusyBox wget, which cannot send Basic credentials.
      test:
        - CMD-SHELL
        - "wget -qS --spider http://localhost:8080/rest/v1/targets 2>&1 | grep -qE 'HTTP/1.1 (200|401)'"
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 120s

  # ── Operator backend and UI ────────────────────────────────────────────────
  backend:
    # Built from the repository root so proto/ is shared with the OTA agent.
    build:
      context: .
      dockerfile: backend/Dockerfile
    networks:
      - fms-backend
    ports:
      - "3000:3000"
    env_file: ./influxdb/fms-demo.env
    environment:
      INFLUXDB_TOKEN_FILE: /tmp/fms-demo.token
      VEHICLES_FILE: /app/vehicles.json
      HAWKBIT_URL: http://hawkbit:8080
      HAWKBIT_USER: ${HAWKBIT_USER:-admin}
      HAWKBIT_PASSWORD: ${HAWKBIT_PASSWORD:-admin}
      HAWKBIT_GATEWAY_TOKEN: ${HAWKBIT_GATEWAY_TOKEN:-fleet-demo-gateway-token}
      RUST_LOG: "info,backend=debug"
    volumes:
      - ./seed/vehicles.json:/app/vehicles.json:ro
      - ./config/zenoh/config-client.json5:/zenoh-config.json5:ro
      - influxdb-auth:/tmp:ro
    depends_on:
      influxdb:
        condition: service_healthy
      hawkbit:
        condition: service_healthy
      fms-zenoh-router:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    networks:
      - fms-backend
    ports:
      # Override with FRONTEND_PORT if 8090 is taken on your machine.
      - "${FRONTEND_PORT:-8090}:80"
    environment:
      BACKEND_URL: ${FRONTEND_BACKEND_URL:-http://localhost:3000}
    depends_on:
      - backend
    restart: unless-stopped
